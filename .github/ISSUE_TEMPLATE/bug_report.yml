name: 问题反馈
description: 报告启动、认证、注销或界面问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交账号、密码、学号、设备 IP/MAC、凭据文件或未遮挡的截图。
        网络问题可使用应用的“网络诊断 → 复制结果”，粘贴前请再次检查内容。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 1.1.4 安装版 / 便携版
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: 接入方式
      options:
        - 校园 Wi-Fi
        - 有线网络
        - 与网络无关的界面或启动问题
  - type: textarea
    id: details
    attributes:
      label: 复现步骤、预期和实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: 脱敏后的诊断结果（可选）
      render: text
